name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Missing Gradle Wrapper
      run: |
        # Download and extract an official Gradle distribution matching your version (9.3.1)
        wget https://gradle.org
        unzip -q gradle-9.3.1-bin.zip
        
        # Use the downloaded distribution to generate the missing gradlew scripts locally
        ./gradle-9.3.1/bin/gradle wrapper
        
        # Clean up the unzipped setup package
        rm -rf gradle-9.3.1-bin.zip gradle-9.3.1
        echo "Successfully generated gradlew executable!"

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
