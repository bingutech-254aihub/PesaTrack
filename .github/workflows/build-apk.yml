name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Mock Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        echo "Successfully provisioned temporary debug key wrapper!"

    # Injects the missing string resource that AuthScreen.kt is looking for
    - name: Inject Missing Firebase Resource Strings
      run: |
        STRINGS_FILE="app/src/main/res/values/strings.xml"
        
        # Ensure the directories exist just in case
        mkdir -p app/src/main/res/values
        
        # If strings.xml doesn't exist, create a baseline; otherwise, insert the missing web client ID
        if [ ! -f "$STRINGS_FILE" ]; then
          echo '<resources><string name="app_name">PesaTrack</string><string name="default_web_client_id">mock_client_id_placeholder</string></resources>' > "$STRINGS_FILE"
        else
          # Insert the placeholder key right before the closing </resources> tag
          sed -i 's|</resources>|<string name="default_web_client_id">mock_client_id_placeholder</string></resources>|' "$STRINGS_FILE"
        fi
        echo "Successfully injected placeholder default_web_client_id string asset."

    # Uses the official configuration setup
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
